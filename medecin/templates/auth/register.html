{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription Spécialiste</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>

<body>

<div class="container">

    <div class="card">

        <h2>Créer un compte Spécialiste</h2>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Nom d'utilisateur</label>
            <input type="text" name="username" placeholder="Nom d'utilisateur" required>

            <label>Nom complet</label>
            <input type="text" name="nom" placeholder="Nom complet du spécialiste" required>

            <label>Spécialité</label>
            <input type="text" name="specialite" placeholder="Ex : Cardiologue" required>

            <label>Mot de passe</label>
            <input type="password" name="password" placeholder="Mot de passe" required>

            <label>Confirmer le mot de passe</label>
            <input type="password" name="confirm" placeholder="Confirmation du mot de passe" required>

            <button type="submit">
                Créer le compte
            </button>

        </form>

        <p class="link">
            Vous avez déjà un compte ?
            <a href="{% url 'login_medecin' %}">
                Se connecter
            </a>
        </p>

    </div>

</div>

</body>
</html>
